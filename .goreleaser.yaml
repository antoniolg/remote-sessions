# Builds the server for every OS and publishes it to GitHub Releases and the Homebrew tap.
# Release: tag vX.Y.Z and run scripts/release.sh, which loads the signing secrets and runs `goreleaser release --clean`.
version: 2
project_name: remote-sessions

builds:
  - main: ./cmd/remote-sessions
    binary: remote-sessions
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

# Signs the macOS binaries with the Developer ID certificate and notarizes them. macOS ties privacy
# permissions (Full Disk Access) to the signing identity, so an ad-hoc signature lost them on every upgrade.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        # Brew and the install scripts don't quarantine the binary, so the release doesn't wait for Apple:
        # the stable signature is what keeps the permissions. New certificates can take hours to notarize.
        wait: false

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

# A formula, like the other tools in the tap: formulas are not quarantined.
brews:
  - name: remote-sessions
    repository:
      owner: antoniolg
      name: homebrew-tap
    directory: Formula
    homepage: https://antonioleiva.com/en/projects/remote-sessions
    description: Use your Claude Code sessions from your phone
    license: MIT
    install: |
      bin.install "remote-sessions"
    test: |
      assert_match version.to_s, shell_output("#{bin}/remote-sessions version")
    caveats: |
      Run `remote-sessions setup` to start the background service and pair your phone.
