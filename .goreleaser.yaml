# Builds the server for every OS and publishes it to GitHub Releases and the Homebrew tap.
# Release: tag vX.Y.Z and run `goreleaser release --clean` with GITHUB_TOKEN (needs write access to antoniolg/homebrew-tap).
version: 2
project_name: remote-sessions

builds:
  - main: ./cmd/remote-sessions
    binary: remote-sessions
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

# A formula, like the other tools in the tap: formulas are not quarantined, so the unnotarized binary runs as is.
brews:
  - name: remote-sessions
    repository:
      owner: antoniolg
      name: homebrew-tap
    directory: Formula
    homepage: https://antonioleiva.com/en/projects/remote-sessions
    description: Use your Claude Code sessions from your phone
    license: MIT
    install: |
      bin.install "remote-sessions"
    test: |
      assert_match version.to_s, shell_output("#{bin}/remote-sessions version")
    caveats: |
      Run `remote-sessions setup` to start the background service and pair your phone.
