name: RemoteSessions
options:
  bundleIdPrefix: com.antonioleiva
  # English is the source language; translations live in the String Catalogs (*.xcstrings).
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    DEVELOPMENT_TEAM: G9B2SPDPZG
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  RemoteSessions:
    type: application
    platform: iOS
    sources: [RemoteSessions]
    settings:
      base:
        # Kept from the app's first name: App Store Connect ties the record to this id.
        PRODUCT_BUNDLE_IDENTIFIER: com.antonioleiva.clauderemote
        PRODUCT_NAME: RemoteSessions
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Remote Sessions
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: RemoteSessions/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # The server is reached by IP or LAN name with a self-signed certificate that the app pins.
        # Tailscale addresses (100.64.0.0/10) are not "local" for ATS, which rejected the self-signed
        # certificate before PinningDelegate could check it. Trust comes from the pinned fingerprint.
        # (NSAllowsLocalNetworking would make iOS ignore NSAllowsArbitraryLoads, so it must not be set.)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Usage descriptions are translated in RemoteSessions/InfoPlist.xcstrings.
        NSLocalNetworkUsageDescription: Remote Sessions connects to your computer on the local network to show your Claude Code conversations.
        NSBonjourServices: [_remotesessions._tcp]
        NSCameraUsageDescription: The camera is used to scan the QR code shown by your computer.
        CFBundleURLTypes:
          - CFBundleURLName: com.antonioleiva.remotesessions
            CFBundleURLSchemes: [remotesessions]
  RemoteSessionsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RemoteSessionsTests]
    dependencies:
      - target: RemoteSessions
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.antonioleiva.remotesessions.tests
schemes:
  RemoteSessions:
    build:
      targets:
        RemoteSessions: all
        RemoteSessionsTests: [test]
    test:
      targets: [RemoteSessionsTests]
